{{- if .Values.externalSecret.enabled }}
{{- $_ := required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
{{- $_ := required "externalSecret.data must map required runtime keys" .Values.externalSecret.data }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "dusk-control-plane.fullname" . }}
  labels:
    {{- include "dusk-control-plane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.runtimeSecret.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
