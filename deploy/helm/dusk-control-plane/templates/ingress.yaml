{{- if .Values.ingress.enabled }}
{{- $_ := required "ingress.className is required" .Values.ingress.className }}
{{- $_ := required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dusk-control-plane.fullname" . }}
  labels:
    {{- include "dusk-control-plane.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "dusk-control-plane.fullname" . }}
                port:
                  name: http
{{- end }}
