{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dusk-control-plane.serviceAccountName" . }}
  labels:
    {{- include "dusk-control-plane.labels" . | nindent 4 }}
  {{- if or .Values.migration.enabled .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.migration.enabled }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
