apiVersion: v1
kind: Service
metadata:
  name: {{ include "dusk-control-plane.fullname" . }}
  labels:
    {{- include "dusk-control-plane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dusk-control-plane.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
