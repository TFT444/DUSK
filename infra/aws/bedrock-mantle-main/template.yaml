AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM role and optional GitHub OIDC provider for the DUSK Bedrock Mantle
  main validation workflow. Trust is restricted to the ShieldTech-Ltd/DUSK
  repository's real-agent GitHub Actions environment only.

Parameters:
  GitHubOrg:
    Type: String
    Default: ShieldTech-Ltd
    Description: GitHub organisation name (case-sensitive)
  GitHubRepo:
    Type: String
    Default: DUSK
    Description: Repository name without owner prefix (case-sensitive)
  GitHubOrgId:
    Type: String
    AllowedPattern: "^[0-9]+$"
    Description: Immutable numeric GitHub organisation ID
  GitHubRepoId:
    Type: String
    AllowedPattern: "^[0-9]+$"
    Description: Immutable numeric GitHub repository ID
  GitHubEnvironment:
    Type: String
    Default: real-agent
    Description: GitHub Actions environment name (must match exactly)
  RoleName:
    Type: String
    Default: DuskRealAgentMainMantleRole
    Description: Name for the IAM role
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of an existing GitHub Actions OIDC provider in this AWS account.
      Leave blank to create a provider.

Conditions:
  CreateOidcProvider:
    Fn::Equals:
      - Ref: ExistingOidcProviderArn
      - ""

Resources:
  GitHubOidcProvider:
    Condition: CreateOidcProvider
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DuskMantleMainRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateOidcProvider
                  - Fn::GetAtt:
                      - GitHubOidcProvider
                      - Arn
                  - Ref: ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub":
                  Fn::Sub: >-
                    repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: BedrockMantleMainInference
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CallWithBearerToken
                Resource: "*"
                Condition:
                  StringEquals:
                    "bedrock-mantle:bearerTokenType": SHORT_TERM
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock-mantle:GetProject
                  - bedrock-mantle:ListProjects
                  - bedrock-mantle:ListTagsForResource
                Resource:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*

Outputs:
  RoleArn:
    Value:
      Fn::GetAtt:
        - DuskMantleMainRole
        - Arn
    Description: ARN of the IAM role for the DUSK Mantle main validation workflow
  OidcProviderArn:
    Value:
      Fn::If:
        - CreateOidcProvider
        - Fn::GetAtt:
            - GitHubOidcProvider
            - Arn
        - Ref: ExistingOidcProviderArn
    Description: ARN of the GitHub OIDC provider (created here or supplied)
