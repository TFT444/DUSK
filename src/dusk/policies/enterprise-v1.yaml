name: dusk-enterprise
version: 1.0.0
default_decision: ALLOW
rules:
  - &enforced
    id: DUSK-IAM-001
    version: 1.0.0
    title: Prevent agent self-privilege escalation
    category: identity
    severity: critical
    decision: DENY
    status: enforced
    owner: DUSK Security
    rationale: An agent cannot increase its own authority.
    frameworks: [OWASP-AGENTIC, NIST-AI-RMF]
    match:
      - {field: action.type, operator: equals, value: iam.role.assign}
      - {field: action.target_identity, operator: equals, value: "$identity.agent_id"}
      - {field: action.role, operator: in, value: [owner, administrator, root]}
    prerequisites: []
    tests: [allow, deny, bypass, sequence]
  - <<: *enforced
    id: DUSK-IAM-002
    title: Prevent cross-tenant actions
    rationale: An action cannot cross the authenticated tenant boundary.
    match:
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: action.tenant_id, operator: exists, value: true}
      - {field: action.tenant_id, operator: not_equals, value: "$identity.tenant_id"}
  - <<: *enforced
    id: DUSK-PERMIT-001
    title: Reject missing or invalid permits
    category: permit
    rationale: Consequential actions require a valid broker-verifiable permit.
    match:
      - {field: action.consequential, operator: equals, value: true}
      - {field: permit.valid, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-PERMIT-002
    title: Reject expired permits
    category: permit
    rationale: Expired authorization cannot approve a new action.
    match:
      - {field: permit.expired, operator: equals, value: true}
  - <<: *enforced
    id: DUSK-PERMIT-003
    title: Reject replayed permits
    category: permit
    rationale: Execution permits are single use.
    match:
      - {field: permit.replayed, operator: equals, value: true}
  - <<: *enforced
    id: DUSK-PERMIT-004
    title: Reject permit and action mismatch
    category: permit
    rationale: A permit is bound to the exact tool and parameter digest.
    match:
      - {field: permit.present, operator: equals, value: true}
      - {field: permit.action_matches, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-BROKER-001
    title: Prevent direct broker bypass
    category: broker
    rationale: Protected systems must only be reached through the credential-holding broker.
    match:
      - {field: action.protected_target, operator: equals, value: true}
      - {field: execution.via_broker, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-SECRET-001
    title: Prevent secret-bearing file access
    category: secrets
    rationale: Agents must not read credential material directly.
    match:
      - {field: action.type, operator: in, value: [filesystem.read, filesystem.copy]}
      - {field: resource.classification, operator: equals, value: secret}
  - <<: *enforced
    id: DUSK-SECRET-002
    title: Prevent secret exfiltration
    category: secrets
    rationale: Secret values cannot cross an external trust boundary.
    match:
      - {field: data.contains_secret, operator: equals, value: true}
      - {field: destination.external, operator: equals, value: true}
  - <<: *enforced
    id: DUSK-EXEC-001
    title: Prevent destructive command execution
    category: execution
    rationale: Destructive operating-system actions require a safer controlled workflow.
    match:
      - {field: action.type, operator: equals, value: process.execute}
      - {field: action.command_class, operator: in, value: [destructive, persistence, defense_evasion]}
  - <<: *enforced
    id: DUSK-FS-001
    title: Prevent filesystem workspace escape
    category: filesystem
    rationale: Agent filesystem access is restricted to approved roots.
    match:
      - {field: action.type, operator: in, value: [filesystem.read, filesystem.write, filesystem.delete]}
      - {field: resource.within_approved_root, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-NET-001
    title: Prevent unrestricted network exposure
    category: network
    rationale: Agents cannot expose services to all internet addresses.
    match:
      - {field: action.type, operator: equals, value: network.firewall.update}
      - {field: action.cidrs, operator: contains, value: 0.0.0.0/0}
  - <<: *enforced
    id: DUSK-NET-002
    title: Prevent unapproved external destinations
    category: network
    rationale: External network destinations must be explicitly trusted.
    match:
      - {field: destination.external, operator: equals, value: true}
      - {field: destination.approved, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-MCP-001
    title: Prevent untrusted MCP tool invocation
    category: mcp
    rationale: Only registered MCP servers and approved tool schemas may execute.
    match:
      - {field: action.type, operator: equals, value: mcp.tool.call}
      - {field: tool.trusted, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-CONSEQ-001
    title: Require approval for sensitive external actions
    category: consequential
    severity: high
    decision: REQUIRE_APPROVAL
    rationale: Irreversible external side effects require informed human approval.
    match:
      - {field: action.category, operator: in, value: [communication, financial, legal, production, account]}
      - {field: approval.valid, operator: not_true, value: true}
  - <<: *enforced
    id: DUSK-TENANT-001
    title: Prevent cross-tenant resource read
    category: tenant
    rationale: An agent cannot read a resource owned by a tenant other than its authenticated tenant.
    match:
      - {field: action.type, operator: in, value: [resource.read, resource.get, resource.list]}
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: not_equals, value: "$identity.tenant_id"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-002
    title: Prevent cross-tenant resource write
    category: tenant
    rationale: An agent cannot write or modify a resource owned by a tenant other than its authenticated tenant.
    match:
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: not_equals, value: "$identity.tenant_id"}
      - {field: action.type, operator: in, value: [resource.write, resource.update, resource.delete, resource.patch]}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-003
    title: Prevent cross-tenant search or vector retrieval
    category: tenant
    rationale: Vector and keyword search must be scoped to the authenticated tenant's retrieval filter.
    match:
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: tenant.retrieval_filter_tenant, operator: exists, value: true}
      - {field: tenant.retrieval_filter_tenant, operator: not_equals, value: "$identity.tenant_id"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-004
    title: Prevent cross-tenant cache or memory access
    category: tenant
    rationale: Cache and memory storage partitions must match the identity partition of the acting agent.
    match:
      - {field: tenant.storage_partition, operator: exists, value: true}
      - {field: tenant.identity_partition, operator: exists, value: true}
      - {field: tenant.storage_partition, operator: not_equals, value: "$tenant.identity_partition"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-005
    title: Prevent cross-tenant audit access
    category: tenant
    rationale: Audit records can only be read by the tenant that owns them.
    match:
      - {field: action.type, operator: equals, value: audit.read}
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: exists, value: true}
      - {field: tenant.resource_owner, operator: not_equals, value: "$identity.tenant_id"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-006
    title: Prevent shared credential use across tenants
    category: tenant
    rationale: A credential must only be used within the tenant it was issued for.
    match:
      - {field: identity.tenant_id, operator: exists, value: true}
      - {field: tenant.credential_bound_tenant, operator: exists, value: true}
      - {field: tenant.credential_bound_tenant, operator: not_equals, value: "$identity.tenant_id"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-007
    title: Prevent project boundary crossover
    category: tenant
    rationale: An agent identity must not access resources that belong to a different project boundary.
    match:
      - {field: tenant.project, operator: exists, value: true}
      - {field: tenant.identity_project, operator: exists, value: true}
      - {field: tenant.project, operator: not_equals, value: "$tenant.identity_project"}
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-TENANT-008
    title: Prevent production and non-production environment crossover
    category: tenant
    rationale: A non-production identity must never access production resources.
    match:
      - {field: tenant.environment, operator: equals, value: production}
      - {field: tenant.identity_environment, operator: exists, value: true}
      - {field: tenant.identity_environment, operator: not_equals, value: production}
    tests: [allow, deny, bypass, missing-evidence]

  - &iam_enforced
    id: DUSK-IAM-003
    version: 1.0.0
    title: Prevent identity impersonation
    category: identity
    severity: critical
    decision: DENY
    status: enforced
    owner: DUSK Security
    rationale: An agent cannot act as another principal without delegated authorization.
    frameworks: [OWASP-AGENTIC, NIST-AI-RMF]
    match:
      - {field: action.type, operator: equals, value: identity.assume}
      - {field: action.initiating_principal, operator: exists, value: true}
      - {field: delegation.present, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-004
    title: Require an initiating principal for privileged actions
    rationale: A privileged action must have a recorded initiating human principal.
    match:
      - {field: action.privileged, operator: equals, value: true}
      - {field: action.initiating_principal, operator: exists, value: false}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-005
    title: Prevent environment credential crossover
    rationale: A credential issued for one environment cannot be used in another.
    match:
      - {field: action.target_environment, operator: exists, value: true}
      - {field: identity.credential_environment, operator: not_equals, value: "$action.target_environment"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-006
    title: Require fresh step-up authorization
    decision: REQUIRE_APPROVAL
    rationale: Actions requiring fresh authentication must have a current valid approval.
    match:
      - {field: action.requires_fresh_authn, operator: equals, value: true}
      - {field: approval.valid, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-007
    title: Prevent workload identity audience mismatch
    rationale: A workload identity token must be scoped to the target service audience.
    match:
      - {field: action.target_service, operator: exists, value: true}
      - {field: identity.audience, operator: not_equals, value: "$action.target_service"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-008
    title: Prevent stale or revoked identity use
    rationale: Revoked or stale identities must not be permitted to perform actions.
    match:
      - {field: identity.revoked, operator: equals, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-009
    title: Prevent privilege use outside assigned role
    rationale: An identity cannot perform actions that require a role it has not been assigned.
    match:
      - {field: action.required_role, operator: exists, value: true}
      - {field: identity.role, operator: not_equals, value: "$action.required_role"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-010
    title: Prevent service account interactive login
    rationale: Service accounts must authenticate non-interactively; interactive sessions indicate credential misuse.
    match:
      - {field: action.type, operator: equals, value: auth.login}
      - {field: identity.type, operator: equals, value: service_account}
      - {field: identity.interactive, operator: equals, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-011
    title: Prevent identity assurance downgrade
    rationale: An action requiring assurance cannot proceed when identity assurance is insufficient.
    match:
      - {field: action.requires_assurance, operator: equals, value: true}
      - {field: identity.assurance_sufficient, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *iam_enforced
    id: DUSK-IAM-012
    title: Prevent privileged action without fresh authentication
    rationale: Privileged actions requiring fresh authentication must be preceded by a confirmed re-authentication event.
    match:
      - {field: action.privileged, operator: equals, value: true}
      - {field: action.requires_fresh_authn, operator: equals, value: true}
      - {field: identity.fresh_authn_confirmed, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-PERMIT-005
    title: Enforce maximum permit lifetime
    category: permit
    rationale: A permit whose computed lifetime exceeds the configured maximum cannot be honoured.
    match:
      - {field: permit.present, operator: equals, value: true}
      - {field: permit.lifetime_exceeded, operator: equals, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-PERMIT-006
    title: Reject permits from untrusted issuers
    category: permit
    rationale: Only permits signed by a DUSK-registered issuer authority are valid.
    match:
      - {field: permit.present, operator: equals, value: true}
      - {field: permit.issuer_trusted, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-PERMIT-007
    title: Reject permits used for a broader scope than issued
    category: permit
    rationale: A permit grants authority for exactly the requested scope; scope expansion is forbidden.
    match:
      - {field: permit.present, operator: equals, value: true}
      - {field: permit.action_scope, operator: not_equals, value: "$permit.scope"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-PERMIT-008
    title: Reject approval when content digest does not match action digest
    category: permit
    rationale: An approval is bound to the exact content digest of the action it authorises.
    match:
      - {field: permit.present, operator: equals, value: true}
      - {field: permit.approval_digest, operator: exists, value: true}
      - {field: permit.action_digest, operator: not_equals, value: "$permit.approval_digest"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-BROKER-002
    title: Prevent raw credential retrieval
    category: broker
    rationale: The credential broker must acknowledge every credential operation; unacknowledged retrievals are denied.
    match:
      - {field: action.protected_target, operator: equals, value: true}
      - {field: execution.broker_acknowledged, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-BROKER-003
    title: Reject credential when audience does not match the target action
    category: broker
    rationale: Credentials are audience-scoped; using a credential for a different audience is a mismatch attack.
    match:
      - {field: action.protected_target, operator: equals, value: true}
      - {field: execution.action_audience, operator: not_equals_or_missing, value: "$execution.credential_audience"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-BROKER-004
    title: Reject credential whose lifetime exceeds the action lifetime
    category: broker
    rationale: A credential must not outlive the action it was issued for; excess lifetime increases the blast radius of compromise.
    match:
      - {field: action.protected_target, operator: equals, value: true}
      - {field: execution.credential_expiry, operator: greater_than_or_missing, value: "$execution.action_expiry"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence]
  - <<: *enforced
    id: DUSK-BROKER-005
    title: Prevent broker decision bypass or race condition
    category: broker
    rationale: An action submitted before the broker has made its authorisation decision circumvents the broker and must be denied.
    match:
      - {field: action.protected_target, operator: equals, value: true}
      - {field: execution.action_request_time, operator: less_than_or_missing, value: "$execution.broker_decision_time"}
    prerequisites: []
    tests: [allow, deny, bypass, race-condition, missing-evidence]
  - &planned
    id: DUSK-FS-002
    version: 1.0.0
    title: Prevent authentication file modification
    category: filesystem
    severity: critical
    decision: DENY
    status: planned
    owner: DUSK Security
    rationale: Permits must not be valid beyond their maximum permitted lifetime.
    frameworks: [OWASP-AGENTIC, NIST-AI-RMF]
    match: []
    prerequisites: [canonical path classification]
    tests: []
  - <<: *planned
    id: DUSK-FS-003
    title: Prevent policy and audit-log tampering
    category: filesystem
    prerequisites: [protected DUSK resource registry]
  - <<: *planned
    id: DUSK-FS-004
    title: Require approval for recursive deletion
    category: filesystem
    severity: high
    decision: REQUIRE_APPROVAL
    prerequisites: [filesystem operation impact]
  - <<: *planned
    id: DUSK-EXEC-002
    title: Prevent unapproved interpreter execution
    category: execution
    prerequisites: [executable identity, interpreter allowlist]
  - <<: *planned
    id: DUSK-EXEC-003
    title: Prevent download-to-execution chains
    category: execution
    prerequisites: [session event correlation]
  - <<: *planned
    id: DUSK-EXEC-004
    title: Prevent sandbox escape primitives
    category: execution
    prerequisites: [host capability and mount telemetry]
  - <<: *planned
    id: DUSK-EXEC-005
    title: Prevent security-control disablement
    category: execution
    prerequisites: [security control registry]
  - <<: *planned
    id: DUSK-NET-003
    title: Prevent cloud metadata endpoint access
    category: network
    prerequisites: [resolved destination IP]
  - <<: *planned
    id: DUSK-NET-004
    title: Prevent tunnels and reverse shells
    category: network
    prerequisites: [process and connection correlation]
  - <<: *planned
    id: DUSK-NET-005
    title: Require approval for network-boundary changes
    category: network
    severity: high
    decision: REQUIRE_APPROVAL
    prerequisites: [network resource impact]
  - <<: *enforced
    id: DUSK-CLOUD-001
    title: Require approval for production deletion
    category: cloud
    severity: critical
    decision: REQUIRE_APPROVAL
    rationale: Production resource deletion requires explicit approval bound to the requested action.
    match:
      - {field: action.type, operator: equals, value: cloud.resource.delete}
      - {field: cloud.environment, operator: equals, value: production}
      - {field: approval.valid, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-002
    title: Prevent disabling encryption backups or audit logs
    category: cloud
    rationale: Runtime safeguards for encryption, backup, and audit collection must remain enabled.
    match:
      - {field: action.type, operator: equals, value: cloud.control.update}
      - {field: cloud.control, operator: in, value: [encryption, backup, audit]}
      - {field: cloud.enabled, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-003
    title: Prevent public cloud resources
    category: cloud
    rationale: Cloud resources must not be made publicly reachable without a separately approved boundary.
    match:
      - {field: cloud.public_exposure, operator: equals, value: true}
      - {field: approval.valid, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-004
    title: Prevent cluster-wide administrator grants
    category: cloud
    rationale: Workload identities must not receive cluster-admin or equivalent cluster-wide authority.
    match:
      - {field: kubernetes.operation, operator: equals, value: rbac.grant}
      - {field: kubernetes.role, operator: in, value: [cluster-admin, system:masters, admin]}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-005
    title: Prevent privileged workload creation
    category: cloud
    rationale: Privileged workloads can escape namespace and node isolation boundaries.
    match:
      - {field: kubernetes.operation, operator: equals, value: workload.create}
      - {field: kubernetes.privileged, operator: equals, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-006
    title: Prevent secret retrieval outside workload identity
    category: cloud
    rationale: Secret retrieval must be authorized for the cryptographically bound workload identity.
    match:
      - {field: action.type, operator: equals, value: secret.read}
      - {field: cloud.workload_identity_authorized, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-007
    title: Prevent public load balancer or ingress exposure
    category: cloud
    rationale: Kubernetes services and ingress objects must not create an unapproved public boundary.
    match:
      - {field: kubernetes.operation, operator: in, value: [service.create, ingress.create]}
      - {field: kubernetes.public_exposure, operator: equals, value: true}
      - {field: approval.valid, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-008
    title: Prevent destructive infrastructure plans
    category: cloud
    rationale: Infrastructure plans containing destructive replacement or deletion require a controlled workflow.
    match:
      - {field: infrastructure.destructive, operator: equals, value: true}
      - {field: approval.valid, operator: not_true, value: true}
    prerequisites: []
    tests: [allow, deny, bypass, sequence, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-009
    title: Prevent plans that disable audit backup or encryption controls
    category: cloud
    rationale: Infrastructure plans must preserve mandatory audit, backup, and encryption safeguards.
    match:
      - {field: infrastructure.disables_controls, operator: contains_any, value: [audit, backup, encryption]}
    prerequisites: []
    tests: [allow, deny, bypass, sequence, missing-evidence, watch, enforce]
  - <<: *enforced
    id: DUSK-CLOUD-010
    title: Prevent cross-account or cross-subscription mutation
    category: cloud
    rationale: Mutations must remain inside the cloud account or subscription bound to the workload identity.
    match:
      - {field: cloud.source_boundary, operator: exists, value: true}
      - {field: cloud.target_boundary, operator: not_equals, value: "$cloud.source_boundary"}
    prerequisites: []
    tests: [allow, deny, bypass, missing-evidence, watch, enforce]
  - <<: *planned
    id: DUSK-DATA-001
    title: Require approval for bulk data export
    category: data
    severity: high
    decision: REQUIRE_APPROVAL
    prerequisites: [record count, purpose binding]
  - <<: *planned
    id: DUSK-DATA-002
    title: Prevent regulated data transfer
    category: data
    prerequisites: [data classification, destination jurisdiction]
  - <<: *planned
    id: DUSK-DATA-003
    title: Require approval for sensitivity-amplifying joins
    category: data
    severity: high
    decision: REQUIRE_APPROVAL
    prerequisites: [dataset lineage, derived classification]
  - <<: *planned
    id: DUSK-DATA-004
    title: Redact sensitive telemetry
    category: data
    decision: DENY
    prerequisites: [telemetry field classification]
  - <<: *planned
    id: DUSK-COMMS-001
    title: Bind approval to exact recipients and content
    category: communication
    prerequisites: [message digest, recipient digest]
  - <<: *planned
    id: DUSK-COMMS-002
    title: Prevent undisclosed human impersonation
    category: communication
    prerequisites: [message authorship metadata]
  - <<: *planned
    id: DUSK-MCP-002
    title: Prevent MCP tool-schema drift
    category: mcp
