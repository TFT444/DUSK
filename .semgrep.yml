rules:
  - id: dusk-python-subprocess-shell
    languages: [python]
    severity: ERROR
    message: Avoid shell=True; pass an argument list to subprocess APIs.
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: $RUNNER(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $RUNNER
          regex: ^(run|call|check_call|check_output|Popen)$

  - id: dusk-flask-debug-enabled
    languages: [python]
    severity: ERROR
    message: Flask debug mode must not be enabled in committed runtime code.
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: $APP.config["DEBUG"] = True

  - id: dusk-unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: Use yaml.safe_load for data that is not fully trusted.
    pattern: yaml.load(...)

  - id: dusk-http-call-without-timeout
    languages: [python]
    severity: ERROR
    message: Outbound HTTP calls need an explicit timeout.
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.patch(...)
          - pattern: requests.delete(...)
      - pattern-not: requests.$METHOD(..., timeout=$TIMEOUT, ...)

  - id: dusk-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Never deserialize untrusted pickle data.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  - id: dusk-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification must remain enabled.
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: dusk-user-controlled-file-open
    languages: [python]
    severity: ERROR
    message: Resolve and validate request-derived paths before opening files.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.get_json(...)
          - pattern: request.json
    pattern-sinks:
      - pattern: open(...)

  - id: dusk-sensitive-exception-response
    languages: [python]
    severity: ERROR
    message: Do not return raw exception details to callers.
    pattern-either:
      - pattern: return jsonify(..., error=str($EXC), ...)
      - pattern: 'return { ..., "error": str($EXC), ... }'
