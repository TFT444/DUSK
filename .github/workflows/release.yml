name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing verified annotated tag used for a dry run
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install build twine pip-audit PyYAML
      - env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/run_group.py --results results/release
          --controls REL-001 REL-002 REL-003 REL-004 REL-005 REL-006 REL-007 --
          sh scripts/ci/release_controls.sh "$RELEASE_REF"
      - id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.json
            dist/SHA256SUMS
      - env:
          OUTCOME: "${{ steps.attest.outcome }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          status=FAIL
          if test "$OUTCOME" = success; then
            status=PASS
            for artifact in dist/*; do
              gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" || status=FAIL
            done
          fi
          python scripts/ci/control.py record --control REL-008 --status "$status" --output results/release/REL-008.json --details "attestation creation=$OUTCOME verification=$status"
          test "$status" = PASS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: release-control-results, path: "results/", if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: release-artifacts, path: "dist/", if-no-files-found: error, retention-days: 30}

  release-gate:
    if: always()
    needs: [release-controls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-control-results, path: results}
      - env: {UPSTREAM: "${{ needs.release-controls.result }}"}
        run: |
          test "$UPSTREAM" = success
          python scripts/validate_provider_certification.py \
            docs/evidence/provider-certification.json
          python scripts/ci/control.py aggregate --lane release --results results

  publish:
    needs: [release-gate]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-artifacts, path: dist}
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: gh release create "$RELEASE_REF" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "DUSK $RELEASE_REF"
