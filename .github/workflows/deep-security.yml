name: Deep security
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  general:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          pip install -e ".[dev]" atheris pip-audit pip-licenses 'mutmut==2.4.5'
          pip install --require-hashes -r ci/example-requirements.lock
      - run: sh scripts/ci/deep_controls.sh general
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-general-results, path: results/, if-no-files-found: error, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-general-evidence, path: deep-evidence/, if-no-files-found: warn, retention-days: 30}

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: policy-mutation, control: SEC-032}
          - {group: auth-mutation, control: SEC-033}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          pip install -e ".[dev]" 'mutmut==2.4.5'
          pip install --require-hashes -r ci/example-requirements.lock
      - run: sh scripts/ci/deep_controls.sh "${{ matrix.group }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "deep-${{ matrix.group }}-results", path: results/, if-no-files-found: error, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "deep-${{ matrix.group }}-evidence", path: deep-evidence/, if-no-files-found: warn, retention-days: 30}

  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - env:
          # The official action entrypoint consumes INPUT_REPO_TOKEN internally.
          # The GITHUB_TOKEN fallback deliberately fails classic protection reads.
          SCORECARD_TOKEN: "${{ secrets.SCORECARD_TOKEN || github.token }}"
        run: sh scripts/ci/deep_controls.sh scorecard
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-scorecard-results, path: results/, if-no-files-found: error, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-scorecard-evidence, path: deep-evidence/, if-no-files-found: warn, retention-days: 30}

  deep-security-gate:
    if: always()
    needs: [general, mutation, scorecard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "deep-*-results", path: results, merge-multiple: true}
      - env: {NEEDS_JSON: "${{ toJSON(needs) }}"}
        run: |
          aggregate_rc=0
          python scripts/ci/control.py aggregate --lane deep --results results || aggregate_rc=$?
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")
          test -z "$failures" || { echo "$failures"; exit 1; }
          test "$aggregate_rc" -eq 0
