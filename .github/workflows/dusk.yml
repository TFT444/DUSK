name: CI
on:
  push: {branches: [dev, main]}
  pull_request: {branches: [dev, main]}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: "."

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgresql:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: dusk_control_plane
          POSTGRES_USER: dusk_control_plane
          POSTGRES_PASSWORD: ci-integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dusk_control_plane -d dusk_control_plane"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            dusk-agent-harness/pyproject.toml
            services/control-plane/pyproject.toml
      - run: >-
          pip install -e ".[dev]" -e "./services/control-plane[dev]"
          atheris vulture openapi-spec-validator==0.9.0
          flask flask-cors gunicorn python-dotenv requests
          -r dusk-agent-harness/runtime/requirements.txt
          -r dusk-agent-harness/mock-prod/requirements.txt
      - name: Run integrity, quality, contracts, and tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/ci/pr_correctness.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Run PostgreSQL migration and repository integration tests
        env:
          DUSK_TEST_DATABASE_URL: postgresql+asyncpg://dusk_control_plane:ci-integration-only@127.0.0.1:5432/dusk_control_plane
        run: pytest -q -n 0 services/control-plane/tests/integration
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: correctness-results, path: results/, if-no-files-found: error, retention-days: 30}

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", control: PR-043}
          - {python: "3.12", control: PR-044}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/control-plane/pyproject.toml
      - run: pip install -e ".[dev]" -e "./services/control-plane[dev]"
      - run: >-
          python scripts/ci/run_group.py --results results/compat-${{ matrix.python }}
          --controls ${{ matrix.control }} -- sh -c
          'pytest -q && pytest -q services/control-plane/tests'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "compatibility-${{ matrix.python }}-results", path: results/, if-no-files-found: error, retention-days: 30}

  security-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: >-
          pip install bandit[toml] pip-audit semgrep==1.172.0 detect-secrets pytest PyYAML
          actionlint-py==1.7.12.24 zizmor==1.29.0
      - name: Run SAST, secret, dependency, and workflow policy checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/ci/pr_security.sh "$BASE_SHA" "$HEAD_SHA"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: security-results, path: results/, if-no-files-found: error, retention-days: 30}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with: {languages: python, queries: security-extended}
      - id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          # Preserve the base branch's analysis identity so GitHub can compare
          # PR alerts instead of emitting a neutral "configuration not found".
          category: /language:python
      - env: {OUTCOME: "${{ steps.analyze.outcome }}"}
        run: |
          status=$(test "$OUTCOME" = success && echo PASS || echo FAIL)
          python scripts/ci/control.py record --control SEC-001 --status "$status" --output results/codeql/SEC-001.json --details "CodeQL $OUTCOME"
          test "$status" = PASS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: codeql-results, path: results/, if-no-files-found: error, retention-days: 30}

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgresql:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: dusk_control_plane
          POSTGRES_USER: dusk_control_plane
          POSTGRES_PASSWORD: ci-container-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dusk_control_plane -d dusk_control_plane"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DUSK_TEST_DATABASE_URL: postgresql+asyncpg://dusk_control_plane:ci-container-only@127.0.0.1:5432/dusk_control_plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          python scripts/ci/run_group.py --results results/containers
          --controls CTR-001 CTR-002 CTR-003 CTR-004 CTR-005 CTR-006 CTR-007 CTR-008 CTR-009 CTR-010 --
          sh scripts/ci/container_controls.sh
      - name: OWASP watch scenario using scanned images
        working-directory: dusk-agent-harness
        run: sh scripts/run_owasp_demo.sh --no-build watch
      - name: OWASP enforce scenario using scanned images
        working-directory: dusk-agent-harness
        run: sh scripts/run_owasp_demo.sh --no-build enforce
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: container-results, path: results/, if-no-files-found: error, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence
          path: |
            container-evidence/
            dusk-agent-harness/ci-logs/
          if-no-files-found: warn
          retention-days: 30

  deployment-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v3.18.6}
      - name: Lint and render the production chart
        run: |
          helm lint deploy/helm/dusk-control-plane
          helm template dusk-control-plane deploy/helm/dusk-control-plane \
            --namespace dusk-system > /tmp/dusk-control-plane.yaml
          test -s /tmp/dusk-control-plane.yaml
          helm template dusk-control-plane deploy/helm/dusk-control-plane \
            --namespace dusk-system \
            --set externalSecret.enabled=true \
            --set externalSecret.secretStoreRef.name=ci-store \
            --set 'externalSecret.data[0].secretKey=database-url' \
            --set 'externalSecret.data[0].remoteRef.key=ci/database-url' \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set ingress.tlsSecretName=dusk-tls \
            > /tmp/dusk-control-plane-first-install.yaml
          python scripts/validate_control_plane_deployment.py first-install \
            /tmp/dusk-control-plane-first-install.yaml

  security-gate:
    if: always()
    needs: [correctness, compatibility, security-tools, codeql, containers, deployment-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "*-results", path: all-results, merge-multiple: true}
      - env: {NEEDS_JSON: "${{ toJSON(needs) }}"}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")
          test -z "$failures" || { echo "$failures"; exit 1; }
          python scripts/ci/control.py aggregate --lane pr --results all-results
