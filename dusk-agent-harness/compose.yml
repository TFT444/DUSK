# DUSK Production Agent Harness. `docker compose up` runs the local stack
# keyless. Watch mode is the default; DUSK_ENFORCE switches to
# enforce. Optional SIE enrichment is external and disabled in the default
# stack. Webhooks target the local metadata sink, so serving a request requires
# no outbound network access.

services:
  dusk-gate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DUSK_ENFORCE: "false"
      DUSK_GATE_BASELINE_PATH: "/app/sample-data/baseline.json"
      DUSK_GATE_BASELINE_SOURCE: "generic"
      DUSK_DEMO_INTEGRATIONS: "false"
      DUSK_GATE_API_KEY: "${DUSK_GATE_API_KEY:-}"
      DUSK_GATE_ALLOW_ANONYMOUS: "${DUSK_GATE_ALLOW_ANONYMOUS:-true}"
      DUSK_CORS_ALLOWED_ORIGINS: "${DUSK_CORS_ALLOWED_ORIGINS:-}"
      DUSK_SIE_ENDPOINT: "${DUSK_SIE_ENDPOINT:-}"
      SIE_API_KEY: "${SIE_API_KEY:-}"
      DUSK_SIE_ENCODE_MODEL: "BAAI/bge-m3"
      DUSK_SIE_SCORE_MODEL: "BAAI/bge-reranker-v2-m3"
      DUSK_SIE_EXTRACT_MODEL: "urchade/gliner_multi-v2.1"
      DUSK_N8N_ALERT_URL: "http://mock-prod:9000/webhook/alert"
      DUSK_N8N_REPORT_URL: "http://mock-prod:9000/webhook/report"
      DUSK_N8N_DECISION_URL: "http://mock-prod:9000/webhook/decision"
      DUSK_OFFENSE_MEMORY_PATH: "/app/state/dusk-offense-memory.json"
    volumes:
      - ./sample-data:/app/sample-data:ro
      - offense-memory:/app/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      mock-prod: { condition: service_healthy }
    networks: [internal]
    ports: ["127.0.0.1:${DUSK_GATE_HOST_PORT:-8000}:8000"] # local-only /v1/gate

  mock-prod:
    build:
      context: ./mock-prod
    environment:
      MOCK_PROD_HOST: "0.0.0.0"
    networks: [internal]
    ports: ["127.0.0.1:${MOCK_PROD_HOST_PORT:-9000}:9000"] # local-only target and webhook logs
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Dummy controller/DB target: actions hit /apply on ALLOW, never on BLOCK.

  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    environment:
      USE_REAL_BEDROCK: "false"
      DUSK_GATE_URL: "http://dusk-gate:8000/v1/gate"
      DUSK_GATE_API_KEY: "${DUSK_GATE_API_KEY:-}"
      MOCK_PROD_URL: "http://mock-prod:9000/apply"
    depends_on:
      dusk-gate: { condition: service_healthy }
      mock-prod: { condition: service_healthy }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # mock-Bedrock by default (keyless); USE_REAL_BEDROCK=true for real Bedrock.

networks:
  internal:
    driver: bridge

volumes:
  offense-memory:
